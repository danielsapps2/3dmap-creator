<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Map Playtest</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>▶</text></svg>" />
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #111; color: #e8ecf2; font: 14px/1.45 system-ui, sans-serif; }
      canvas { display: block; }
      #hud { position: fixed; top: 10px; left: 10px; background: #000a; padding: 8px 12px; border-radius: 8px; font-size: 12px; pointer-events: none; }
      #hud b { font-size: 13px; }
      #event { position: fixed; top: 22%; left: 50%; transform: translateX(-50%); background: #000b; padding: 8px 16px; border-radius: 20px; display: none; }
      #crosshair { position: fixed; left: 50%; top: 50%; width: 6px; height: 6px; margin: -3px; border-radius: 50%; background: #fff9; pointer-events: none; }
      #overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #000a; }
      .card { background: #1c2027; border: 1px solid #2f3540; border-radius: 12px; padding: 24px 28px; max-width: 440px; text-align: center; }
      .card h1 { margin: 0 0 6px; font-size: 20px; }
      .card p { color: #9aa3b0; margin: 6px 0 16px; }
      button, label.btn { font: inherit; background: #2f6fd1; color: #fff; border: 0; border-radius: 6px; padding: 8px 16px; cursor: pointer; display: inline-block; margin: 4px; }
      button.secondary, label.btn { background: #2a303a; }
      a { color: #7fb0ff; }
      kbd { background: #2a303a; border-radius: 4px; padding: 0 5px; }
    </style>
  </head>
  <body>
    <div id="hud"><b id="map-name">No map loaded</b><br /><kbd>WASD</kbd> move · <kbd>Shift</kbd> run · <kbd>Space</kbd> jump · <kbd>R</kbd> respawn · <kbd>Esc</kbd> release mouse<br /><span id="pos"></span></div>
    <div id="crosshair"></div>
    <div id="event"></div>
    <div id="overlay">
      <div class="card">
        <h1 id="title">Map Playtest</h1>
        <p id="subtitle">Load a .glb exported from 3D Map Creator, or press ▶ Play in the editor.</p>
        <button id="play" hidden>Click to play</button>
        <label class="btn">Load .glb…<input id="file" type="file" accept=".glb,.gltf" hidden /></label>
        <p style="margin:14px 0 0"><a href="./index.html">← Back to editor</a></p>
      </div>
    </div>
    <script type="module" src="/src/game/main.js"></script>
  </body>
</html>
